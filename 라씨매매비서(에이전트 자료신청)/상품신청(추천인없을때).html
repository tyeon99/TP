        </div>
        <div class="inquiry-box">
          <strong>문의하기</strong>
          <p>문의가 있다면 라씨 매매비서 고객센터로 연락주세요.</p>

              <img width="21" src="img/kakao-icon.png" alt="카카오톡 아이콘">

            <button>
              <img width="20" src="img/call-icon.png" alt="전화 아이콘">
