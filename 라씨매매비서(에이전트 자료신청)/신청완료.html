<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=360px, initial-scale=1.0,user-scalable=no,maximum-scale=1">
  <title>라씨매매비서 에이전트 자료신청</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://spoqa.github.io/spoqa-han-sans/css/SpoqaHanSansNeo.css" rel="stylesheet" type="text/css">
  <!-- bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
</head>

<body>
  <div class="wrap">

    <div class="header bg-color">
      <button class="back">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M15.5 19L9.20711 12.7071C8.81658 12.3166 8.81658 11.6834 9.20711 11.2929L15.5 5" stroke="#141414"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </div>
    <!-- header -->

    <div class="content">

      <div class="inquiry-wrap">
        <div class="inquiry">
          <div class="title">자료 신청하기</div>
          <p class="text-center">투자자료 신청이 완료되었습니다.</p>
          <div class="box">
            <em>발송예정일</em>
            <span>2025년 2월 20일</span>
          </div>
          <div class="inquiry-box">
            <strong>문의하기</strong>
            <p>문의가 있다면 라씨 매매비서 고객센터로 연락주세요.</p>
            <div class="btn-group">
              <button>
                <img width="21" src="img/kakao-icon.png" alt="카카오톡 아이콘">
                <span>카카오톡 문의</span>
              </button>
              <button>
                <img width="20" src="img/call-icon.png" alt="전화 아이콘">
                <span>전화 문의</span>
              </button>
            </div>
          </div>
        </div>
      </div>

    </div>
    <!-- content -->

  </div>
  <!-- wrap -->

  <!-- bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
    crossorigin="anonymous"></script>
</body>

</html>
